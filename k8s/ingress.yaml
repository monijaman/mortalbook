# ───────────────────────────────────────────────────────────────────────
# Public frontend + API gateway ingress
# Requires: ingress-nginx, cert-manager with a ClusterIssuer named letsencrypt-prod
# ───────────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mortalbook-ingress
  namespace: mortalbook
  labels:
    app.kubernetes.io/part-of: mortalbook
  annotations:
    # Controller
    kubernetes.io/ingress.class: "nginx"

    # TLS / cert-manager
    cert-manager.io/cluster-issuer: "letsencrypt-prod"

    # Security headers
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/hsts: "true"
    nginx.ingress.kubernetes.io/hsts-max-age: "31536000"
    nginx.ingress.kubernetes.io/hsts-include-subdomains: "true"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";

    # Rate limiting (per remote IP)
    nginx.ingress.kubernetes.io/limit-rps: "30"
    nginx.ingress.kubernetes.io/limit-connections: "20"

    # Timeouts
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"

    # Body size limit
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"

    # CORS (enable if frontend and API are on different origins)
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://mortalbook.example.com"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type, Accept"
spec:
  tls:
    - hosts:
        - mortalbook.example.com
        - admin.mortalbook.example.com
      secretName: mortalbook-tls
  rules:
    # ── Public site ──────────────────────────────────────────────────────────────────
    - host: mortalbook.example.com
      http:
        paths:
          # Next.js frontend (catch-all)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
          # memorial-service REST API
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: memorial-service
                port:
                  number: 8080

    # ── Admin subdomain ──────────────────────────────────────────────────────────────
    - host: admin.mortalbook.example.com
      http:
        paths:
          # Vue 3 admin panel (SPA)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin-panel
                port:
                  number: 8080
          # FastAPI admin service REST API (v1 + v2)
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: admin-service
                port:
                  number: 5002
---
# ───────────────────────────────────────────────────────────────────────
# Internal gRPC ingress for memorial-service
# Requires ingress-nginx compiled with grpc support
# ───────────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: memorial-grpc-ingress
  namespace: mortalbook
  labels:
    app.kubernetes.io/part-of: mortalbook
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/backend-protocol: "GRPC"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - grpc.mortalbook.example.com
      secretName: mortalbook-grpc-tls
  rules:
    - host: grpc.mortalbook.example.com
      http:
        paths:
          - path: /memorial.v1.MemorialService
            pathType: Prefix
            backend:
              service:
                name: memorial-service
                port:
                  number: 50001
