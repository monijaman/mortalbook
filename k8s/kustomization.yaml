apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mortalbook

resources:
  # 1. Namespace, quota, limits (must come first)
  - namespace.yaml
  # 2. Shared configuration
  - configmap.yaml
  - secrets.yaml
  # 3. Network controls
  - network-policy.yaml
  # 4. Ingress (depends on services being present)
  - ingress.yaml
