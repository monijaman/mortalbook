# ── PostgreSQL credentials ──────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: mortalbook
  labels:
    app: postgres
    app.kubernetes.io/part-of: mortalbook
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "CHANGE_ME_STRONG_PASSWORD"
  POSTGRES_DB: "mortalbook_db"
---
# ── memorial-service credentials ────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: memorial-service-secret
  namespace: mortalbook
  labels:
    app: memorial-service
    app.kubernetes.io/part-of: mortalbook
type: Opaque
stringData:
  DB_USER: "postgres"
  DB_PASSWORD: "CHANGE_ME_STRONG_PASSWORD"
  REDIS_PASSWORD: ""
---
# ── admin-service credentials ───────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: admin-service-secret
  namespace: mortalbook
  labels:
    app: admin-service
    app.kubernetes.io/part-of: mortalbook
type: Opaque
stringData:
  DB_USER: "postgres"
  DB_PASSWORD: "CHANGE_ME_STRONG_PASSWORD"
  REDIS_PASSWORD: ""
  JWT_SECRET: "CHANGE_ME_JWT_SECRET_MIN_32_CHARS"
  ADMIN_SERVICE_SECRET_KEY: "CHANGE_ME_ADMIN_SECRET_KEY"
