# IMPORTANT: replace stringData values before deploying to production
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: mortalbook
  labels:
    app: postgres
    app.kubernetes.io/part-of: mortalbook
type: Opaque
stringData:
  POSTGRES_DB: "mortalbook_db"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"
