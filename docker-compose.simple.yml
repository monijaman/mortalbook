version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mortalbook-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-mortalbook_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mortalbook-network

  redis:
    image: redis:7-alpine
    container_name: mortalbook-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mortalbook-network

  admin-panel:
    image: nginx:1.25-alpine
    container_name: mortalbook-admin-panel
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - ./services/admin-panel/dist:/usr/share/nginx/html:ro
    environment:
      - NGINX_HOST=localhost
      - NGINX_PORT=8080
    command: sh -c "echo 'server { listen 8080; root /usr/share/nginx/html; index index.html; location / { try_files $$uri $$uri/ /index.html; } }' > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
    networks:
      - mortalbook-network

  frontend:
    image: node:20-alpine
    container_name: mortalbook-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    working_dir: /app
    volumes:
      - ./services/frontend:/app
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - NEXT_PUBLIC_ADMIN_API_URL=http://localhost:5002
    command: sh -c "cd /app && npx next start"
    networks:
      - mortalbook-network

volumes:
  postgres_data:
  redis_data:

networks:
  mortalbook-network:
    driver: bridge
