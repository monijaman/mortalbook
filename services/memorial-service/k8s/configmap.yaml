apiVersion: v1
kind: ConfigMap
metadata:
  name: memorial-service-config
  namespace: mortalbook
  labels:
    app: memorial-service
    app.kubernetes.io/name: memorial-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: mortalbook
data:
  # ── Application ────────────────────────────────────────────────────────────
  APP_ENV: "production"

  # ── HTTP / gRPC ports ───────────────────────────────────────────────────────
  PORT: "8080"
  GRPC_PORT: "50001"

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  DB_HOST: "postgres" # Kubernetes DNS: <service>.<namespace>.svc.cluster.local
  DB_PORT: "5432"
  DB_NAME: "mortalbook_db"

  # ── Redis ───────────────────────────────────────────────────────────────────
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  # TTL values (seconds)
  REDIS_CACHE_TTL: "300" # 5 min — individual memorial cache
  REDIS_DAILY_CACHE_TTL: "600" # 10 min — daily memorial list cache

  # ── Kafka ───────────────────────────────────────────────────────────────────
  KAFKA_BROKERS: "kafka:9092"
  KAFKA_MEMORIAL_TOPIC: "memorial-events"

  # ── Observability ───────────────────────────────────────────────────────────
  LOG_LEVEL: "info"
  LOG_FORMAT: "json" # structured logging for log aggregators
