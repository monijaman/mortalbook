apiVersion: apps/v1
kind: Deployment
metadata:
  name: memorial-service
  namespace: mortalbook
  labels:
    app: memorial-service
    app.kubernetes.io/name: memorial-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: mortalbook
    version: v1
  annotations:
    deployment.kubernetes.io/revision: "1"
spec:
  # Initial replica count; HPA overrides this at runtime
  replicas: 2
  selector:
    matchLabels:
      app: memorial-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0 # zero-downtime rolling update
  template:
    metadata:
      labels:
        app: memorial-service
        version: v1
      annotations:
        # Prometheus scraping
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      # ----------------------------------------------------------------
      # Security hardening
      # ----------------------------------------------------------------
      serviceAccountName: memorial-service
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532 # distroless nonroot uid
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault

      # ----------------------------------------------------------------
      # Topology: spread pods across nodes for HA
      # ----------------------------------------------------------------
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: memorial-service

      # ----------------------------------------------------------------
      # Init container: wait for PostgreSQL to be ready
      # ----------------------------------------------------------------
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do
                echo "Waiting for postgres…"; sleep 2
              done
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

      # ----------------------------------------------------------------
      # Application container
      # ----------------------------------------------------------------
      containers:
        - name: memorial-service
          image: mortalbook/memorial-service:1.0.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: grpc
              containerPort: 50001
              protocol: TCP

          # ---------- environment: non-sensitive from ConfigMap ----------
          envFrom:
            - configMapRef:
                name: memorial-service-config

          # ---------- environment: sensitive from Secret -----------------
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: memorial-service-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: memorial-service-secret
                  key: DB_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: memorial-service-secret
                  key: REDIS_PASSWORD
                  optional: true # Redis may not require auth in all envs

          # ---------- health checks -------------------------------------
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1

          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 5

          # ---------- resource budget -----------------------------------
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          # ---------- security context ----------------------------------
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          # ---------- graceful shutdown ---------------------------------
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]

          # ---------- tmp volume for read-only rootfs -------------------
          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}

      # ----------------------------------------------------------------
      # Pod-level settings
      # ----------------------------------------------------------------
      restartPolicy: Always
      terminationGracePeriodSeconds: 60
      dnsPolicy: ClusterFirst
