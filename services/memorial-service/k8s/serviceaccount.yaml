apiVersion: v1
kind: ServiceAccount
metadata:
  name: memorial-service
  namespace: mortalbook
  labels:
    app: memorial-service
    app.kubernetes.io/name: memorial-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: mortalbook
automountServiceAccountToken: false
---
# Minimal RBAC: the service has no need to talk to the Kubernetes API,
# so we bind no ClusterRole and grant no permissions.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: memorial-service-role
  namespace: mortalbook
rules: [] # no permissions required

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: memorial-service-rolebinding
  namespace: mortalbook
subjects:
  - kind: ServiceAccount
    name: memorial-service
    namespace: mortalbook
roleRef:
  kind: Role
  name: memorial-service-role
  apiGroup: rbac.authorization.k8s.io
