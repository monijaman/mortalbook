apiVersion: v1
kind: Secret
metadata:
  name: memorial-service-secret
  namespace: mortalbook
  labels:
    app: memorial-service
    app.kubernetes.io/name: memorial-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: mortalbook
  annotations:
    # In production replace with an external secrets manager
    # (e.g. AWS Secrets Manager, Vault, Sealed Secrets)
    kubernetes.io/description: "Sensitive credentials for memorial-service"
type: Opaque
# ──────────────────────────────────────────────────────────────────────────────
# IMPORTANT: Replace ALL values below before deploying to production.
# Prefer using `kubectl create secret` or an external secrets operator
# instead of committing plain-text values to version control.
# ──────────────────────────────────────────────────────────────────────────────
stringData:
  # PostgreSQL credentials (must match postgres Secret)
  DB_USER: "postgres"
  DB_PASSWORD: "CHANGE_ME_STRONG_PASSWORD"

  # Redis AUTH password — leave empty string if Redis has no password
  REDIS_PASSWORD: ""
