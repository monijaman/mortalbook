apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-service
  namespace: mortalbook
  labels:
    app: admin-service
    app.kubernetes.io/name: admin-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: mortalbook
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: admin-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: admin-service
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5002"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: admin-service
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: admin-service

      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            [
              "sh",
              "-c",
              "until nc -z postgres 5432; do echo 'Waiting for postgres...'; sleep 2; done",
            ]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

      containers:
        - name: admin-service
          image: mortalbook/admin-service:1.0.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5002
              protocol: TCP

          envFrom:
            - configMapRef:
                name: admin-service-config

          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: admin-service-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: admin-service-secret
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: admin-service-secret
                  key: JWT_SECRET
            - name: ADMIN_SERVICE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: admin-service-secret
                  key: ADMIN_SERVICE_SECRET_KEY
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: admin-service-secret
                  key: REDIS_PASSWORD
                  optional: true

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1

          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 5

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}

      restartPolicy: Always
      terminationGracePeriodSeconds: 60
      dnsPolicy: ClusterFirst
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: admin-service
  namespace: mortalbook
  labels:
    app: admin-service
    app.kubernetes.io/part-of: mortalbook
automountServiceAccountToken: false
