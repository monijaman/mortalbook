name: Deploy to Staging

on:
  push:
    branches: [develop]

env:
  REGISTRY: ghcr.io
  KUBE_CLUSTER: staging-cluster
  KUBE_REGION: us-east-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker images
        run: |
          for service in memorial-service admin-service frontend admin-panel; do
            docker buildx build --push \
              -t ${{ env.REGISTRY }}/${{ github.repository }}/$service:${{ github.sha }} \
              -t ${{ env.REGISTRY }}/${{ github.repository }}/$service:staging-latest \
              ./services/$service
          done

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Update image in k8s manifests
        run: |
          for service in memorial-service admin-service frontend admin-panel; do
            sed -i "s|image:.*$service.*|image: ${{ env.REGISTRY }}/${{ github.repository }}/$service:${{ github.sha }}|g" \
              services/$service/k8s/deployment.yaml
          done

      - name: Deploy to staging
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/secrets.yaml
          kubectl apply -f infrastructure/postgres/k8s/
          kubectl apply -f infrastructure/redis/k8s/
          kubectl apply -f infrastructure/kafka/k8s/
          kubectl apply -f services/memorial-service/k8s/
          kubectl apply -f services/admin-service/k8s/
          kubectl apply -f services/frontend/k8s/
          kubectl apply -f services/admin-panel/k8s/
          kubectl apply -f k8s/ingress.yaml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/memorial-service -n mortalbook
          kubectl rollout status deployment/admin-service -n mortalbook
          kubectl rollout status deployment/frontend -n mortalbook
          kubectl rollout status deployment/admin-panel -n mortalbook

      - name: Run smoke tests
        run: |
          kubectl run smoke-test --image=curlimages/curl --rm -i --restart=Never -- \
            curl -f http://frontend:3000 || exit 1
