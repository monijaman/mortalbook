# Only the dependencies; run backend and frontend locally:
#   docker compose -f docker-compose.dev.yml up -d
#   (backend)  DATABASE_URL=postgres://mortalbook:mortalbook@localhost:5432/mortalbook cargo run
#   (frontend) npm install && npm run dev
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mortalbook
      POSTGRES_PASSWORD: mortalbook
      POSTGRES_DB: mortalbook
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  translate:
    image: libretranslate/libretranslate:latest
    environment:
      LT_CHAR_LIMIT: "20000"
      LT_REQ_LIMIT: "0"
    ports: ["5000:5000"]
    volumes: [ltmodels:/home/libretranslate/.local]
volumes:
  pgdata:
  ltmodels:
