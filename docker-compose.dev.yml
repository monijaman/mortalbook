# Development mode - minimal services for testing frontend and admin-panel
version: '3.9'

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - mortalbook-network

services:
  postgres:
    image: postgres:16-alpine
    container_name: mortalbook-postgres
    <<: *service-defaults
    environment:
      POSTGRES_DB: ${DB_NAME:-mortalbook_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mortalbook-redis
    <<: *service-defaults
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Simple HTTP server for admin-panel (serve pre-built dist)
  admin-panel:
    image: nginx:1.25-alpine
    container_name: mortalbook-admin-panel
    <<: *service-defaults
    ports:
      - "8081:8080"
    volumes:
      - ./services/admin-panel/dist:/usr/share/nginx/html:ro
      - ./infrastructure/nginx-spa.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:

networks:
  mortalbook-network:
    driver: bridge
