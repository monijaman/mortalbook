services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mortalbook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mortalbook}
      POSTGRES_DB: mortalbook
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mortalbook"]
      interval: 5s
      retries: 10

  # Self-hosted machine translation + language detection (no API key needed).
  # First start downloads language models and can take several minutes.
  translate:
    image: libretranslate/libretranslate:latest
    environment:
      LT_CHAR_LIMIT: "20000"
      LT_REQ_LIMIT: "0"
    volumes:
      - ltmodels:/home/libretranslate/.local

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://mortalbook:${POSTGRES_PASSWORD:-mortalbook}@db:5432/mortalbook
      TRANSLATE_URL: http://translate:5000
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
  ltmodels:
