version: '3.9'

# ─────────────────────────────────────────────────────────────────────────────
# Shared extension fields (reduce repetition)
# ─────────────────────────────────────────────────────────────────────────────
x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - mortalbook-network

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ====================================
  # INFRASTRUCTURE SERVICES
  # ====================================

  postgres:
    image: postgres:16-alpine
    container_name: mortalbook-postgres
    <<: *service-defaults
    environment:
      POSTGRES_DB: ${DB_NAME:-mortalbook_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-mortalbook_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *default-logging

  redis:
    image: redis:7-alpine
    container_name: mortalbook-redis
    <<: *service-defaults
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging: *default-logging

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: mortalbook-zookeeper
    <<: *service-defaults
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx256m"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *default-logging

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: mortalbook-kafka
    <<: *service-defaults
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions.sh --bootstrap-server kafka:9092"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging: *default-logging

  # ====================================
  # MICROSERVICES
  # ====================================

  memorial-service:
    build:
      context: ./services/memorial-service
      dockerfile: Dockerfile
    image: mortalbook/memorial-service:latest
    container_name: mortalbook-memorial-service
    <<: *service-defaults
    ports:
      - "8080:8080"
      - "50001:50001"
    environment:
      - PORT=8080
      - GRPC_PORT=50001
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-mortalbook_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_MEMORIAL_TOPIC=memorial-events
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=json
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *default-logging

  admin-service:
    build:
      context: ./services/admin-service
      dockerfile: Dockerfile
    image: mortalbook/admin-service:latest
    container_name: mortalbook-admin-service
    <<: *service-defaults
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
      - APP_ENV=${APP_ENV:-development}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-mortalbook_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MEMORIAL_GRPC_ADDR=memorial-service:50001
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_MEMORIAL_TOPIC=memorial-events
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_SERVICE_SECRET_KEY=${ADMIN_SERVICE_SECRET_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - RATE_LIMIT_REQUESTS=10
      - RATE_LIMIT_WINDOW_SECONDS=60
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      memorial-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5002/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *default-logging

  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
    image: mortalbook/frontend:latest
    container_name: mortalbook-frontend
    <<: *service-defaults
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - NEXT_PUBLIC_ADMIN_API_URL=http://localhost:5002
    depends_on:
      memorial-service:
        condition: service_healthy
      admin-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *default-logging

  admin-panel:
    build:
      context: ./services/admin-panel
      dockerfile: Dockerfile
    image: mortalbook/admin-panel:latest
    container_name: mortalbook-admin-panel
    <<: *service-defaults
    ports:
      - "8081:8080"    # exposed on 8081 to avoid conflict with memorial-service:8080
    depends_on:
      admin-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/nginx-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: *default-logging

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  zookeeper_data:
    driver: local
  zookeeper_log:
    driver: local
  kafka_data:
    driver: local

networks:
  mortalbook-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
